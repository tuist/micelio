# Local stack: MinIO plus two Micelio nodes.
#
# Two nodes rather than one on purpose. Almost everything interesting here is
# about what happens between replicas, and a single node cannot show you a
# replica catching up on someone else's push.
name: micelio

services:
  minio:
    # Pinned rather than :latest, because the end-to-end suite asserts on
    # conditional-write behaviour and that is exactly the kind of thing that
    # changes between releases.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: micelio
      MINIO_ROOT_PASSWORD: micelio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - minio:/data

  createbucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 micelio micelio-secret &&
      mc mb --ignore-existing local/micelio &&
      echo 'bucket ready'
      "

  micelio-1: &micelio
    build: .
    depends_on:
      createbucket:
        condition: service_completed_successfully
    environment: &micelio-env
      MICELIO_S3_BUCKET: micelio
      MICELIO_S3_ENDPOINT: http://minio:9000
      MICELIO_S3_ACCESS_KEY_ID: micelio
      MICELIO_S3_SECRET_ACCESS_KEY: micelio-secret
      MICELIO_S3_REGION: us-east-1
      MICELIO_S3_PATH_STYLE: "true"
      MICELIO_ADMIN_TOKEN: local-admin-token
      MICELIO_AUTH_BACKEND: static
      MICELIO_AUTH_TOKENS: "local-token=acme:read,write"
      MICELIO_CLUSTER_STRATEGY: dns
      MICELIO_DNS_QUERY: tasks.micelio
      MICELIO_RELEASE_NAME: micelio
      RELEASE_COOKIE: local-development-cookie
      MICELIO_DEFAULT_REPLICAS: "2"
    ports:
      - "4000:4000"
      - "4002:4002"

  micelio-2:
    <<: *micelio
    environment:
      <<: *micelio-env
    ports:
      - "4010:4000"
      - "4012:4002"

volumes:
  minio:
