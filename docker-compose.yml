# The whole system, locally.
#
# MinIO stands in for S3, and two Micelio nodes cluster with each other. Two
# rather than one on purpose: almost everything interesting here happens
# *between* replicas, and a single node cannot show you a push to one node
# being immediately visible on another, which is the central claim.
#
#   docker compose up --build -d
#   docker compose ps                      # wait for healthy
#
#   # create a repository (any node will do; there is no primary to find)
#   curl -X POST localhost:14002/repositories \
#     -H 'Authorization: Bearer local-admin-token' \
#     -H 'content-type: application/json' \
#     -d '{"repository":"acme/app"}'
#
#   # push to node 1
#   git clone http://x-access-token:local-token@localhost:14000/acme/app.git
#
# On macOS, add `-c credential.helper=` to those git commands. The keychain
# helper blocks trying to store a credential for a host:port it has not seen
# before, and the symptom is a git command that hangs with no output at all.
#
#   # and fetch it from node 2, which has never seen it before
#   git clone http://x-access-token:local-token@localhost:14010/acme/app.git
#
#   # watch the cluster and the log
#   curl -H 'Authorization: Bearer local-admin-token' localhost:14002/cluster
#   curl -H 'Authorization: Bearer local-admin-token' localhost:14002/repositories/acme/app
#
# Ports are deliberately unusual: 9000 is MinIO's default and one of the most
# contended ports on a developer machine, and 4000 is Phoenix's.
name: micelio

services:
  minio:
    # Pinned rather than :latest, because the end-to-end suite asserts on
    # conditional-write behaviour and that is exactly the kind of thing that
    # changes between releases.
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: micelio
      MINIO_ROOT_PASSWORD: micelio-secret
    ports:
      # Deliberately not the port spec/support/stack.sh uses: the end-to-end
      # stack runs its own MinIO, and two stacks sharing a port means one
      # silently talks to the other's storage.
      - "19020:9000"
      - "19021:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes:
      - minio:/data

  createbucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 micelio micelio-secret &&
      mc mb --ignore-existing local/micelio &&
      echo 'bucket ready'
      "

  micelio-1: &micelio
    build: .
    depends_on:
      createbucket:
        condition: service_completed_successfully
    networks:
      default:
        aliases:
          # Both nodes answer to this name, so one DNS lookup returns both
          # addresses and the cluster forms itself. This is the same mechanism
          # a Kubernetes headless Service provides.
          - micelio-node
    environment: &micelio-env
      MICELIO_S3_BUCKET: micelio
      MICELIO_S3_ENDPOINT: http://minio:9000
      MICELIO_S3_ACCESS_KEY_ID: micelio
      MICELIO_S3_SECRET_ACCESS_KEY: micelio-secret
      MICELIO_S3_REGION: us-east-1
      MICELIO_S3_PATH_STYLE: "true"
      MICELIO_ADMIN_TOKEN: local-admin-token
      MICELIO_AUTH_BACKEND: static
      MICELIO_AUTH_TOKENS: "local-token=acme:read,write"
      MICELIO_CLUSTER_STRATEGY: dns
      MICELIO_DNS_QUERY: micelio-node
      MICELIO_RELEASE_NAME: micelio
      # Distributed Erlang's shared secret. Nodes with different cookies fail
      # to cluster, silently.
      RELEASE_COOKIE: local-development-cookie
      MICELIO_DEFAULT_REPLICAS: "2"
    healthcheck:
      # Readiness, not liveness: it checks that object storage is reachable,
      # because a node that cannot read the log cannot answer consistently.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4002/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    ports:
      - "14000:4000"
      - "14002:4002"

  micelio-2:
    <<: *micelio
    environment:
      <<: *micelio-env
    ports:
      - "14010:4000"
      - "14012:4002"

volumes:
  minio:
