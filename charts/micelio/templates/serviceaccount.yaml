{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "micelio.serviceAccountName" . }}
  labels:
    {{- include "micelio.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Clustering needs no API access: nodes find each other through headless-service
# DNS. The only reason to mount a token is in-cluster OIDC, where verifying a
# pod's token means reading the cluster's own signing keys — and that endpoint
# is authenticated.
automountServiceAccountToken: {{ and (eq .Values.auth.backend "oidc") .Values.auth.oidc.kubernetes }}
{{- end }}
{{- if and (eq .Values.auth.backend "oidc") .Values.auth.oidc.kubernetes }}
---
# The one API permission Micelio ever needs, and it is read-only: fetch the
# cluster's OIDC discovery document and public signing keys, so a pod's
# projected token can be verified without any secret being distributed.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "micelio.fullname" . }}-issuer-discovery
  labels:
    {{- include "micelio.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:service-account-issuer-discovery
subjects:
  - kind: ServiceAccount
    name: {{ include "micelio.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
