{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "micelio.serviceAccountName" . }}
  labels:
    {{- include "micelio.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No RBAC rules: nodes discover each other through headless-service DNS rather
# than the Kubernetes API, so Micelio needs no API access at all.
automountServiceAccountToken: false
{{- end }}
