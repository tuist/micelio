apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "micelio.fullname" . }}
  labels:
    {{- include "micelio.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "micelio.selectorLabels" . | nindent 6 }}
  strategy:
    # A rolling update is safe at any moment: a terminating pod's repositories
    # are already in the log, so the only cost is that whoever inherits them
    # materializes on first request.
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  template:
    metadata:
      labels:
        {{- include "micelio.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Restart pods when configuration changes, so a `helm upgrade` that
        # only touches values actually takes effect.
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "micelio.serviceAccountName" . }}
      # Kubernetes injects a Docker-link-style variable for every Service in
      # the namespace: a Service named `micelio-admin` becomes
      # MICELIO_ADMIN_PORT=tcp://10.0.0.1:4002, which collides exactly with the
      # variable Micelio reads for its admin port — and the injected value
      # wins over the image's own ENV, so the node dies at boot parsing a URL
      # as an integer. Nothing here uses those variables.
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: micelio
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: git
              containerPort: 4000
              protocol: TCP
            - name: admin
              containerPort: 4002
              protocol: TCP
            - name: epmd
              containerPort: 4369
              protocol: TCP
          env:
            # The pod IP is the only value guaranteed unique and routable
            # without a StatefulSet, so it becomes the Erlang node name.
            - name: MICELIO_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: MICELIO_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: MICELIO_RELEASE_NAME
              value: micelio
            - name: MICELIO_CLUSTER_STRATEGY
              value: kubernetes
            - name: MICELIO_HEADLESS_SERVICE
              value: {{ include "micelio.headlessServiceName" . }}

            - name: MICELIO_S3_BUCKET
              value: {{ .Values.objectStore.bucket | quote }}
            - name: MICELIO_S3_ENDPOINT
              value: {{ required "objectStore.endpoint is required: the write-ahead log is the source of truth" .Values.objectStore.endpoint | quote }}
            - name: MICELIO_S3_REGION
              value: {{ .Values.objectStore.region | quote }}
            - name: MICELIO_S3_PREFIX
              value: {{ .Values.objectStore.prefix | quote }}
            - name: MICELIO_S3_PATH_STYLE
              value: {{ .Values.objectStore.pathStyle | quote }}

            # Set explicitly as well as disabling service links, so a
            # cluster that injects them anyway cannot decide our ports.
            - name: MICELIO_GIT_PORT
              value: "4000"
            - name: MICELIO_HOOK_PORT
              value: "4001"
            - name: MICELIO_ADMIN_PORT
              value: "4002"

            - name: MICELIO_DATA_DIR
              value: /var/lib/micelio/repositories
            # int64 on every numeric value below is load-bearing: Helm parses
            # unquoted YAML numbers as float64, so 268435456 renders as
            # "2.68435456e+08" and the node dies at boot parsing it. It only
            # shows up for values large enough to reach exponent notation,
            # which is why the small ones look like they work.
            - name: MICELIO_DEFAULT_REPLICAS
              value: {{ .Values.config.defaultReplicas | int64 | quote }}
            - name: MICELIO_STALENESS_BUDGET_MS
              value: {{ .Values.config.stalenessBudgetMs | int64 | quote }}
            - name: MICELIO_POLICY_STALENESS_BUDGET_MS
              value: {{ .Values.config.policyStalenessBudgetMs | int64 | quote }}
            - name: MICELIO_COMPACTION_ENTRY_THRESHOLD
              value: {{ .Values.config.compactionEntryThreshold | int64 | quote }}
            - name: MICELIO_COMPACTION_BYTES_THRESHOLD
              value: {{ .Values.config.compactionBytesThreshold | int64 | quote }}
            - name: MICELIO_IDLE_EVICTION_MS
              value: {{ .Values.config.idleEvictionMs | int64 | quote }}
            {{- with .Values.config.publicUrl }}
            - name: MICELIO_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}

            - name: MICELIO_AUTH_BACKEND
              value: {{ .Values.auth.backend | quote }}
            {{- $gitAuthEnabled := or .Values.auth.gitAuth.clientId .Values.auth.gitAuth.registrationEndpoint }}
            {{- if and (ne .Values.auth.backend "oidc") $gitAuthEnabled }}
            {{- fail "auth.gitAuth requires auth.backend=oidc" }}
            {{- end }}
            {{- if eq .Values.auth.backend "oidc" }}
            {{- if and $gitAuthEnabled .Values.auth.oidc.kubernetes }}
            {{- fail "auth.gitAuth requires an external OpenID Connect issuer; it cannot use Kubernetes service-account tokens" }}
            {{- end }}
            {{- if and .Values.auth.gitAuth.clientId .Values.auth.gitAuth.registrationEndpoint }}
            {{- fail "auth.gitAuth.clientId and auth.gitAuth.registrationEndpoint are mutually exclusive" }}
            {{- end }}
            {{- with .Values.auth.oidc.issuer }}
            - name: MICELIO_OIDC_ISSUER
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.auth.oidc.kubernetes }}
            # Empty issuer plus this tells the node to read the issuer from the
            # cluster rather than assume it.
            - name: MICELIO_OIDC_KUBERNETES
              value: "true"
            {{- end }}
            - name: MICELIO_OIDC_AUDIENCE
              value: {{ required "auth.oidc.audience is required: without it tokens are not bound to this deployment" .Values.auth.oidc.audience | quote }}
            {{- with .Values.auth.oidc.jwksUri }}
            - name: MICELIO_OIDC_JWKS_URI
              value: {{ . | quote }}
            {{- end }}
            - name: MICELIO_OIDC_NAMESPACE_GRANTS
              value: {{ .Values.auth.oidc.namespaceGrants | quote }}
            - name: MICELIO_OIDC_GRANTS_CLAIM
              value: {{ .Values.auth.oidc.grantsClaim | quote }}
            {{- if $gitAuthEnabled }}
            {{- with .Values.auth.gitAuth.clientId }}
            - name: MICELIO_GIT_AUTH_CLIENT_ID
              value: {{ . | quote }}
            {{- end }}
            - name: MICELIO_GIT_AUTH_AUTHORIZATION_ENDPOINT
              value: {{ required "auth.gitAuth.authorizationEndpoint is required when auth.gitAuth is enabled" $.Values.auth.gitAuth.authorizationEndpoint | quote }}
            - name: MICELIO_GIT_AUTH_TOKEN_ENDPOINT
              value: {{ required "auth.gitAuth.tokenEndpoint is required when auth.gitAuth is enabled" $.Values.auth.gitAuth.tokenEndpoint | quote }}
            - name: MICELIO_GIT_AUTH_REDIRECT_URI
              value: {{ $.Values.auth.gitAuth.redirectUri | default "http://127.0.0.1" | quote }}
            - name: MICELIO_GIT_AUTH_SCOPES
              value: {{ required "auth.gitAuth.scopes is required when auth.gitAuth is enabled" $.Values.auth.gitAuth.scopes | quote }}
            - name: MICELIO_GIT_AUTH_USERNAME
              value: {{ $.Values.auth.gitAuth.username | default "oauth2" | quote }}
            {{- with .Values.auth.gitAuth.registrationEndpoint }}
            - name: MICELIO_GIT_AUTH_REGISTRATION_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            {{- else if eq .Values.auth.backend "webhook" }}
            - name: MICELIO_AUTH_ENDPOINT
              value: {{ required "auth.webhook.endpoint is required" .Values.auth.webhook.endpoint | quote }}
            {{- end }}

            {{- if .Values.tracing.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ required "tracing.otlpEndpoint is required when tracing is enabled" .Values.tracing.otlpEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.tracing.otlpProtocol | quote }}
            {{- end }}

            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ include "micelio.fullname" . }}-secrets
            {{- with .Values.objectStore.existingSecret }}
            - secretRef:
                name: {{ . }}
            {{- end }}
            {{- if and (eq .Values.auth.backend "webhook") .Values.auth.webhook.existingSecret }}
            - secretRef:
                name: {{ .Values.auth.webhook.existingSecret }}
            {{- end }}
            {{- if and (eq .Values.auth.backend "static") .Values.auth.static.existingSecret }}
            - secretRef:
                name: {{ .Values.auth.static.existingSecret }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: admin
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            # Depends on object storage being reachable: a node that cannot
            # read the log cannot answer consistently, and should leave
            # rotation rather than serve stale data.
            httpGet:
              path: /ready
              port: admin
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health
              port: admin
            failureThreshold: 30
            periodSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: repositories
              mountPath: /var/lib/micelio/repositories
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: repositories
          {{- if .Values.persistence.enabled }}
          # A generic ephemeral volume: one claim per pod, created and deleted
          # with it.
          #
          # Emphatically not a single shared PersistentVolumeClaim. A
          # ReadWriteOnce volume can only attach to one node, so every replica
          # is dragged onto that node — silently defeating the spread
          # constraint — and they then share one set of Git directories, with
          # several nodes repacking and updating the same refs concurrently.
          ephemeral:
            volumeClaimTemplate:
              metadata:
                labels:
                  {{- include "micelio.selectorLabels" . | nindent 18 }}
              spec:
                accessModes:
                  {{- toYaml .Values.persistence.accessModes | nindent 18 }}
                {{- with .Values.persistence.storageClass }}
                storageClassName: {{ . }}
                {{- end }}
                resources:
                  requests:
                    storage: {{ .Values.persistence.size }}
          {{- else }}
          # The cache is disposable by design, so an emptyDir is the honest
          # representation of it. Put the node's local NVMe behind this.
          emptyDir:
            sizeLimit: {{ .Values.persistence.sizeLimit }}
          {{- end }}
        - name: tmp
          emptyDir: {}
