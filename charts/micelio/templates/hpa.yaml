{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "micelio.fullname" . }}
  labels:
    {{- include "micelio.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "micelio.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    {{- if .Values.autoscaling.inFlightMetric.enabled }}
    # The better signal, when something is serving it. A clone holds a
    # connection, a process and a git upload-pack for its whole duration, so
    # concurrency saturates long before CPU does and CPU alone reacts late.
    #
    # Requires prometheus-adapter or KEDA. Without one the HPA cannot compute a
    # replica count *at all* — a metric it cannot fetch disables the whole
    # object rather than falling back to the others.
    - type: Pods
      pods:
        metric:
          name: micelio_git_requests_in_flight
        target:
          type: AverageValue
          averageValue: {{ .Values.autoscaling.inFlightMetric.target | quote }}
    {{- end }}
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
  {{- with .Values.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
