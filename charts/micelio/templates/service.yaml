apiVersion: v1
kind: Service
metadata:
  name: {{ include "micelio.fullname" . }}
  labels:
    {{- include "micelio.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: git
      port: {{ .Values.service.gitPort }}
      targetPort: git
      protocol: TCP
  selector:
    {{- include "micelio.selectorLabels" . | nindent 4 }}
---
# Admin, metrics and health, kept on a separate Service so it can be left off
# any public ingress.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "micelio.fullname" . }}-admin
  labels:
    {{- include "micelio.labels" . | nindent 4 }}
    micelio.tuist.dev/surface: admin
spec:
  type: ClusterIP
  ports:
    - name: admin
      port: {{ .Values.service.adminPort }}
      targetPort: admin
      protocol: TCP
  selector:
    {{- include "micelio.selectorLabels" . | nindent 4 }}
---
# Headless: this is how nodes find each other. libcluster resolves it to pod
# addresses and distributed Erlang connects them.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "micelio.headlessServiceName" . }}
  labels:
    {{- include "micelio.labels" . | nindent 4 }}
spec:
  clusterIP: None
  # Pods must be discoverable the moment they start, before they pass readiness,
  # otherwise a starting node cannot join the cluster it is about to serve in.
  publishNotReadyAddresses: true
  ports:
    - name: epmd
      port: 4369
      protocol: TCP
  selector:
    {{- include "micelio.selectorLabels" . | nindent 4 }}
