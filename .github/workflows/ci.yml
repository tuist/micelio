name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_VERSION: "2026.4.18"
  MISE_GITHUB_ATTESTATIONS: 0

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v2
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: "erlang elixir"
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix credo --strict
      - name: Compile without warnings
        run: mix compile --warnings-as-errors

  test:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v2
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: "erlang elixir"
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-test-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-test-
      - run: mix deps.get
      - run: mix test

  typecheck:
    name: Static type analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v2
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: "erlang elixir"
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-typecheck-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-typecheck-
      - run: mix deps.get
      - run: mix dialyzer --format github

  e2e:
    name: End-to-end
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v2
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: "erlang elixir shellspec"
      - uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-e2e-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-e2e-
      - run: mix deps.get
      # Drives a real git client against a real server backed by real
      # S3-compatible storage, which is the only way to know the product works.
      - name: Run the end-to-end suite
        run: |
          ./spec/support/stack.sh up
          shellspec
      - name: Node logs
        if: failure()
        run: tail -200 tmp/e2e/*.log || true
      - name: Tear down
        if: always()
        run: ./spec/support/stack.sh down || true

  proto:
    name: Schema is up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v2
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: "erlang elixir protoc"
      - run: mix deps.get
      # The generated schema is committed so builds do not need protoc. That is
      # only safe if it cannot drift from the .proto it came from.
      - name: Regenerate and diff
        run: |
          ./scripts/generate-proto.sh
          git diff --exit-code lib/micelio/wal/v1 lib/micelio/policy/v1 \
            || { echo "::error::generated schema is out of date; run 'mise run proto' and commit the result"; exit 1; }

  image:
    name: Container image
    # Single architecture here on purpose: CI is proving the image works, and
    # the release workflow is what proves it builds for both. Emulating the
    # other architecture would multiply the build time to re-check something
    # the Dockerfile does not vary on.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: micelio:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker network create micelio-ci
          docker run -d --name minio --network micelio-ci \
            -e MINIO_ROOT_USER=micelio -e MINIO_ROOT_PASSWORD=micelio-secret \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          docker run --rm --network micelio-ci --entrypoint sh minio/mc:RELEASE.2025-04-16T18-13-26Z -c \
            'until mc alias set local http://minio:9000 micelio micelio-secret; do sleep 1; done; mc mb --ignore-existing local/micelio'

          docker run -d --name micelio --network micelio-ci \
            -e MICELIO_S3_BUCKET=micelio \
            -e MICELIO_S3_ENDPOINT=http://minio:9000 \
            -e MICELIO_S3_ACCESS_KEY_ID=micelio \
            -e MICELIO_S3_SECRET_ACCESS_KEY=micelio-secret \
            -e MICELIO_S3_REGION=us-east-1 \
            -e MICELIO_ADMIN_TOKEN=ci \
            -e MICELIO_AUTH_BACKEND=static \
            -e MICELIO_AUTH_TOKENS='ci-token=acme:read,write' \
            micelio:ci

          for i in $(seq 1 60); do
            docker exec micelio curl -fsS http://127.0.0.1:4002/health >/dev/null 2>&1 && break
            sleep 1
          done

          # A push and a clone through the released artefact, not the source.
          docker exec micelio sh -c '
            set -e
            curl -sS -X POST -H "Authorization: Bearer ci" -H "Content-Type: application/json" \
              -d "{\"repository\":\"acme/ci\"}" http://127.0.0.1:4002/repositories
            export HOME=/tmp GIT_AUTHOR_NAME=CI GIT_AUTHOR_EMAIL=ci@e GIT_COMMITTER_NAME=CI GIT_COMMITTER_EMAIL=ci@e
            mkdir -p /tmp/src && cd /tmp/src && git init -q -b main
            echo hello > README.md && git add . && git commit -qm init
            git push -q http://x-access-token:ci-token@127.0.0.1:4000/acme/ci.git main
            git clone -q http://x-access-token:ci-token@127.0.0.1:4000/acme/ci.git /tmp/clone
            grep -q hello /tmp/clone/README.md
          '
      - name: Container logs
        if: failure()
        run: docker logs micelio || true

  chart:
    name: Helm chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint charts/micelio --set objectStore.endpoint=http://minio:9000 --set auth.oidc.audience=micelio
      - name: Render with autoscaling and ingress enabled
        run: |
          helm template micelio charts/micelio \
            --set objectStore.endpoint=http://minio:9000 \
            --set auth.oidc.audience=micelio \
            --set autoscaling.enabled=true \
            --set ingress.enabled=true \
            --set serviceMonitor.enabled=true > /dev/null

  # Linting and templating a chart proves it is valid YAML, and nothing more.
  # Two bugs that stopped every pod from starting — Kubernetes injecting
  # MICELIO_ADMIN_PORT from a same-named Service, and Helm rendering large
  # integers as "2.68435456e+08" — passed both. The only way to know a chart
  # deploys is to deploy it.
  deploy:
    name: Chart deploys and serves
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      # Three workers, not one. A single-node cluster cannot show pods
      # spreading, placement agreeing across machines, or a repository being
      # served by a node that never held it — which is most of what this
      # architecture claims.
      - uses: helm/kind-action@v1
        with:
          cluster_name: micelio
          config: .github/kind-cluster.yaml

      - name: Build the image and load it into the cluster
        run: |
          docker build -t micelio:ci .
          kind load docker-image micelio:ci --name micelio

      - name: Deploy MinIO
        run: |
          kubectl create namespace micelio
          kubectl -n micelio apply -f - <<'MANIFEST'
          apiVersion: apps/v1
          kind: Deployment
          metadata: {name: minio}
          spec:
            replicas: 1
            selector: {matchLabels: {app: minio}}
            template:
              metadata: {labels: {app: minio}}
              spec:
                containers:
                  - name: minio
                    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
                    args: ["server", "/data"]
                    env:
                      - {name: MINIO_ROOT_USER, value: micelio}
                      - {name: MINIO_ROOT_PASSWORD, value: micelio-secret}
                    ports: [{containerPort: 9000}]
          ---
          apiVersion: v1
          kind: Service
          metadata: {name: minio}
          spec:
            selector: {app: minio}
            ports: [{port: 9000, targetPort: 9000}]
          MANIFEST
          kubectl -n micelio wait --for=condition=available deployment/minio --timeout=180s
          kubectl -n micelio run mc --rm -i --restart=Never \
            --image=minio/mc:RELEASE.2025-04-16T18-13-26Z \
            --env=MC_HOST_local="http://micelio:micelio-secret@minio:9000" \
            -- mb --ignore-existing local/micelio

      - name: Install the chart
        run: |
          kubectl -n micelio create secret generic micelio-s3 \
            --from-literal=MICELIO_S3_ACCESS_KEY_ID=micelio \
            --from-literal=MICELIO_S3_SECRET_ACCESS_KEY=micelio-secret

          helm install micelio charts/micelio -n micelio \
            --set image.repository=micelio --set image.tag=ci --set image.pullPolicy=IfNotPresent \
            --set replicaCount=3 \
            --set objectStore.endpoint=http://minio:9000 \
            --set objectStore.bucket=micelio \
            --set objectStore.region=us-east-1 \
            --set objectStore.existingSecret=micelio-s3 \
            --set auth.backend=static \
            --set auth.static.tokens='ci-token=acme:read\,write' \
            --set adminToken=ci-admin \
            --set resources.requests.cpu=100m \
            --wait --timeout=300s

      - name: The pods landed on different nodes
        run: |
          nodes=$(kubectl -n micelio get pods -l app.kubernetes.io/name=micelio \
            -o 'custom-columns=NODE:.spec.nodeName' --no-headers | sort -u | wc -l)
          echo "pods are spread across $nodes nodes"
          [ "$nodes" -ge 2 ] || { echo "::error::all replicas landed on one node"; exit 1; }

      - name: The pods clustered themselves
        run: |
          pod=$(kubectl -n micelio get pods -l app.kubernetes.io/name=micelio -o jsonpath='{.items[0].metadata.name}')
          members=$(kubectl -n micelio exec "$pod" -- \
            curl -sS -H 'Authorization: Bearer ci-admin' http://127.0.0.1:4002/cluster)
          echo "$members"
          echo "$members" | grep -q 'micelio@.*micelio@' \
            || { echo "::error::the pods did not form a cluster"; exit 1; }

      - name: A push to one pod is served by another
        run: |
          mapfile -t pods < <(kubectl -n micelio get pods -l app.kubernetes.io/name=micelio -o name | sed 's|pod/||')

          kubectl -n micelio exec "${pods[0]}" -- sh -c '
            set -e
            curl -sS -X POST -H "Authorization: Bearer ci-admin" -H "Content-Type: application/json" \
              -d "{\"repository\":\"acme/ci\"}" http://127.0.0.1:4002/repositories >/dev/null
            export HOME=/tmp GIT_AUTHOR_NAME=CI GIT_AUTHOR_EMAIL=ci@e GIT_COMMITTER_NAME=CI GIT_COMMITTER_EMAIL=ci@e
            mkdir -p /tmp/s && cd /tmp/s && git init -q -b main
            echo hello > README.md && git add . && git commit -qm init
            git push -q http://x-access-token:ci-token@127.0.0.1:4000/acme/ci.git main
          '

          # The second pod has never seen this repository and must materialize
          # it from the log on the first request.
          kubectl -n micelio exec "${pods[1]}" -- sh -c '
            export HOME=/tmp
            git clone -q http://x-access-token:ci-token@127.0.0.1:4000/acme/ci.git /tmp/c
            grep -q hello /tmp/c/README.md
          '

      - name: A repository with no copy left on any disk is rebuilt from the log
        run: |
          # The claim the whole design rests on. Evicting everywhere leaves the
          # log in object storage as the only copy; serving must still work.
          for pod in $(kubectl -n micelio get pods -l app.kubernetes.io/name=micelio -o name | sed 's|pod/||'); do
            kubectl -n micelio exec "$pod" -- \
              curl -sS -m 10 -X POST -H 'Authorization: Bearer ci-admin' \
              http://127.0.0.1:4002/evict/acme/ci >/dev/null
            remaining=$(kubectl -n micelio exec "$pod" -- sh -c 'ls /var/lib/micelio/repositories/acme 2>/dev/null | wc -l')
            [ "$remaining" = "0" ] || { echo "::error::$pod still holds a copy"; exit 1; }
          done

          kubectl -n micelio run rebuild --rm -i --restart=Never --image=alpine/git:latest --command -- sh -c '
            export HOME=/tmp
            git clone -q http://x-access-token:ci-token@micelio:4000/acme/ci.git /tmp/r
            grep -q hello /tmp/r/README.md
          '

      - name: Serving through the Service, which round-robins across pods
        run: |
          kubectl -n micelio run gitclient --rm -i --restart=Never --image=alpine/git:latest --command -- sh -c '
            set -e
            export HOME=/tmp
            for i in 1 2 3 4; do
              git clone -q http://x-access-token:ci-token@micelio:4000/acme/ci.git /tmp/c$i
              grep -q hello /tmp/c$i/README.md
            done
          '

      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n micelio get pods -o wide || true
          kubectl -n micelio describe pods -l app.kubernetes.io/name=micelio || true
          kubectl -n micelio logs -l app.kubernetes.io/name=micelio --tail=100 --prefix || true
