name: Release

on:
  push:
    branches:
      - main

# Declared per job rather than once at the top. Least privilege is the reason,
# but it also keeps the release-creating job's token to exactly the scope that
# operation needs, which is the configuration known to work elsewhere in this
# organisation.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  # Deliberately not cancel-in-progress. A release run pushes an image, pushes
  # a chart, then creates the release; cancelling it partway leaves published
  # artefacts with no release describing them. Queueing behind the previous run
  # is slower and always coherent.
  cancel-in-progress: false

env:
  MISE_VERSION: "2026.4.18"
  MISE_GITHUB_ATTESTATIONS: 0
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  detect:
    name: Check for releasable changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      should-release: ${{ steps.detect.outputs.should-release }}
      latest-version: ${{ steps.detect.outputs.latest-version }}
      next-version: ${{ steps.detect.outputs.next-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: "git-cliff"
      - name: Detect release
        id: detect
        run: mise run release:detect

  image:
    name: Build image (${{ matrix.platform }})
    needs: detect
    if: needs.detect.outputs.should-release == 'true'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each architecture is built on a machine of that architecture. The
      # obvious alternative — one job with QEMU — emulates the whole Erlang and
      # Elixir compile, which turned a two-minute build into twenty and made
      # every release queue behind the one before it.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export the digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"
        env:
          digest: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          retention-days: 1

  manifest:
    name: Publish container image
    needs: [detect, image]
    if: needs.detect.outputs.should-release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.inspect.outputs.digest }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests

      # The per-architecture images are pushed by digest and are not yet
      # reachable by tag; this is what binds them together under one.
      - name: Create the manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.detect.outputs.next-version }} \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Read back the published digest
        id: inspect
        run: |
          digest=$(docker buildx imagetools inspect \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.detect.outputs.next-version }}" \
            --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true

  chart:
    name: Publish Helm chart
    needs: [detect, manifest]
    if: needs.detect.outputs.should-release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
      - uses: jdx/mise-action@v2
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: "helm"
      - name: Log in to the registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Package and push
        run: mise run release:chart --version "${{ needs.detect.outputs.next-version }}" --push --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: chart
          path: dist/*

  publish:
    name: Publish GitHub release
    needs: [detect, manifest, chart]
    if: needs.detect.outputs.should-release == 'true'
    runs-on: ubuntu-24.04
    permissions:
      # Creating a release creates a tag, which is a write to contents.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: "git-cliff"
      # By name, not everything: build-push-action also uploads a build-record
      # artifact, and pulling the whole set in makes this job fail for reasons
      # that have nothing to do with the release.
      - uses: actions/download-artifact@v4
        with:
          name: chart
          path: dist
      - name: Generate release notes
        run: |
          mise run release:notes --version "${{ needs.detect.outputs.next-version }}" > release-notes.md
          {
            echo
            echo "## Container image"
            echo
            echo '```sh'
            echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.detect.outputs.next-version }}"
            echo '```'
            echo
            echo "## Helm chart"
            echo
            echo '```sh'
            echo "helm install micelio oci://ghcr.io/tuist/charts/micelio --version ${{ needs.detect.outputs.next-version }}"
            echo '```'
          } >> release-notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run release:publish --version "${{ needs.detect.outputs.next-version }}" --notes release-notes.md --dist dist
